<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCD Prediction | OCD-DL System</title>

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #800020;
    --secondary: #ffd700;
    --text: #343a40;
}

/* ===== BODY ===== */
body {
    margin: 0;
    font-family: 'Lato', sans-serif;
    background-image: url("{{ url_for('static', filename='images/1.jpg') }}");
    background-size: cover;
    background-attachment: fixed;
    color: var(--text);
}

/* ===== HEADER ===== */
.app-header {
    background: var(--primary);
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-left {
    display: flex;
    align-items: center;
}

.menu-btn {
    font-size: 28px;
    color: white;
    cursor: pointer;
    margin-right: 20px;
}

.header-title {
    color: white;
    font-size: 26px;
    font-family: 'Merriweather', serif;
}

/* ===== HEADER BUTTONS ===== */
.header-right a {
    text-decoration: none;
    margin-left: 8px;
}

.header-right button {
    padding: 8px 14px;
    background: var(--primary);
    color: white;
    border: 2px solid var(--secondary);
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
}

.header-right button:hover {
    background: #6a001a;
}

/* ===== SIDEBAR ===== */
.sidebar {
    position: fixed;
    top: 0;
    left: -260px;
    width: 260px;
    height: 100%;
    background: var(--primary);
    padding-top: 70px;
    transition: 0.3s;
}

.sidebar a {
    display: block;
    padding: 15px 25px;
    color: white;
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.2);
}

.sidebar a:hover {
    background: #6a001a;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
}

/* ===== CARD ===== */
.card {
    max-width: 900px;
    margin: 120px auto;
    background: white;
    padding: 45px;
    border-radius: 14px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

.card h2 {
    text-align: center;
    font-family: 'Merriweather', serif;
    color: var(--primary);
    margin-bottom: 30px;
}

/* ===== FORM ===== */
.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

label {
    font-weight: 600;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.full {
    grid-column: span 2;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}

.submit-btn:hover {
    background: #6a001a;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="app-header">
    <div class="header-left">
        <span class="menu-btn" onclick="openMenu()">☰</span>
        <div class="header-title">🧠 OCD Prediction</div>
    </div>

  <div class="header-right">
    <a href="/predict">
        <button class="nav-btn active">🧠 OCD Prediction</button>
    </a>

   

    <a href="/profile">
        <button class="nav-btn">👤 My Profile</button>
    </a>

    <a href="/user_logout">
        <button class="nav-btn logout">🚪 Logout</button>
    </a>
</div>

</div>

<!-- SIDEBAR -->
<div id="sidebar" class="sidebar">
    <a href="/user_dashboard">🏠 User Dashboard</a>
    <a href="/predict">🧠 OCD Prediction</a>

    <a href="/profile">👤 My Profile</a>
    <a href="/user_logout">🚪 Logout</a>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<!-- MAIN CONTENT -->
<div class="card">
<h2>Enter Clinical Details</h2>

<form method="post">
<div class="form-grid">

<!-- LEFT COLUMN -->
 <div class="form-group">
    <label><b>Patient ID</b></label>
    <input type="text"
           name="Patient_ID"
           placeholder="Enter Patient ID"
           required
           class="form-control">
</div>

<div>
<label>Age</label>
<input type="number" name="Age" required>
</div>

<div>
<label>Gender</label>
<select name="Gender" required>
<option value="0">Male</option>
<option value="1">Female</option>
</select>
</div>

<div>
<label>Ethnicity</label>
<select name="Ethnicity" required>
<option value="0">Asian</option>
<option value="1">White</option>
<option value="2">Black</option>
<option value="3">Other</option>
</select>
</div>

<div>
<label>Marital Status</label>
<select name="Marital_Status" required>
<option value="0">Single</option>
<option value="1">Married</option>
</select>
</div>

<div>
<label>Education Level</label>
<select name="Education_Level" required>
<option value="0">School</option>
<option value="1">Graduate</option>
<option value="2">Postgraduate</option>
</select>
</div>

<div>
<label>Duration of Symptoms (months)</label>
<input type="number" name="Duration" required>
</div>

<div>
<label>Previous Diagnoses</label>
<select name="Previous_Diagnoses" required>
<option value="0">No</option>
<option value="1">Yes</option>
</select>
</div>

<div>
<label>Family History of OCD</label>
<select name="Family_History" required>
<option value="0">No</option>
<option value="1">Yes</option>
</select>
</div>



<div>
<label>Compulsion Type</label>
<select name="Compulsion_Type" required>
<option value="0">Checking</option>
<option value="1">Cleaning</option>
<option value="2">Counting</option>
<option value="3">Ordering</option>
</select>
</div>

<div>
<label>Y-BOCS Score (Obsessions)</label>
<input type="number" step="0.1" name="YBOCS_Obs" required>
</div>

<div>
<label>Y-BOCS Score (Compulsions)</label>
<input type="number" step="0.1" name="YBOCS_Comp" required>
</div>

<div>
<label>Depression Diagnosis</label>
<select name="Depression" required>
<option value="0">No</option>
<option value="1">Yes</option>
</select>
</div>

<div>
<label>Anxiety Diagnosis</label>
<select name="Anxiety" required>
<option value="0">No</option>
<option value="1">Yes</option>
</select>
</div>

<div>
<label>Medications</label>
<select name="Medications" required>
<option value="0">No</option>
<option value="1">Yes</option>
</select>
</div>

<div class="full">
<button type="submit" class="submit-btn">Predict OCD Type</button>
</div>

</div>
</form>
</div>

<script>
function openMenu() {
    document.getElementById("sidebar").style.left = "0";
    document.getElementById("overlay").style.display = "block";
}
function closeMenu() {
    document.getElementById("sidebar").style.left = "-260px";
    document.getElementById("overlay").style.display = "none";
}
</script>

</body>
</html>
